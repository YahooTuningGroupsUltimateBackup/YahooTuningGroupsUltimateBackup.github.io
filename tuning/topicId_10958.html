<a href="/tuning">back to list</a><h1>Another example of how definitions get made</h1><h3><a id=10958 href="#10958">🔗</a>Daniel Wolf &#x3C;djwolf@snafu.de&#x3E;</h3><span>6/28/2000 11:22:59 AM</span><label style="float: right; margin-right: 20px"><input type="checkbox" class="monospace" checked> monospace</label><div class='message-text' style='margin: 0px 20px 20px; padding: 20px; background-color: #eee; font-size: 16px; line-height: 1.2; white-space: pre-wrap'><p>The &quot;bibliographic control committee&quot; at work:</p><p><a href="http://www-sul.stanford.edu/depts/music/mlatest/BCC/SAC/96WG20thCent1.html">http://www-sul.stanford.edu/depts/music/mlatest/BCC/SAC/96WG20thCent1.html</a></p></div>
    <script>
        const applyMonospace = monospace => {
            $('.monospace').prop('checked', monospace)
            $('.message-text').css('font-family', monospace ? 'monospace' : '')
        }

        applyMonospace(true)

        $('.monospace').on('change', function () {
            applyMonospace(this.checked)
        })
    </script>
